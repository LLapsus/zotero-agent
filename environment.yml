# ---------------------------------------------------------------------------
# Anthropic API + raw Zotero RAG  -  conda environment
# Setup:
#   conda env create -f environment.yml
#   conda activate anthropic-rag
#
# Note: anthropic / python-dotenv live on PyPI, not conda-forge, so they go
# in the pip: block. This conda+pip hybrid is the normal, supported pattern.
# ---------------------------------------------------------------------------
name: anthropic-rag

channels:
  - conda-forge

dependencies:
  - python=3.12
  - numpy>=1.26
  - requests>=2.31
  - pip
  - pip:
      - anthropic>=0.69       # Claude SDK
      - python-dotenv>=1.0    # load ANTHROPIC_API_KEY from .env
      - ipython>=8.0          # interactive REPL
      # - voyageai>=0.3       # optional: Anthropic's recommended embeddings